[workspace]
members = [
    "crates/core",
    "crates/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["TCM-Library Contributors"]
license = "MIT"
repository = "https://github.com/moxiaoqin12345/TCM-Library-Search"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
regex = "1.10"
base64 = "0.22"
